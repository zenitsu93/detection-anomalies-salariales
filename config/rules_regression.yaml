# Rulebook pour detect_salary_anomalies_regression.py (regles + IsolationForest + regression).
# Copie de config/rules.yaml, a laquelle s'ajoute la section REGRESSION en bas de fichier.
# N'est utilise QUE par detect_salary_anomalies_regression.py : config/rules.yaml reste
# inchange et continue de piloter detect_salary_anomalies_custom_fixed.py tel quel.

rules:
  severity_weights:
    out_of_band: 30        # hors des bornes Min/Max internes (RangePenetration)
    compa_ratio: 20        # CompaRatio hors des bornes [compa_ratio_low, compa_ratio_high]
    market_gap: 15         # MarketRatio hors des bornes [market_low, market_high]
    peer_outlier: 15       # |PeerZ| >= peer_z_threshold_major
    ml_strong_signal: 15   # score ML tres eleve sans aucune regle declenchee

  ml_strong_signal_percentile: 0.95
  ml_contamination: 0.05
  ml_n_estimators: 200

  range_penetration_low_buffer: -0.05
  range_penetration_high_buffer: 0.05
  compa_ratio_low: 0.85
  compa_ratio_high: 1.15
  market_low: 0.90
  market_high: 1.20

  cohort_min_size: 5
  cohort_widening_steps:
    - "Grade|Job_Family|Anciennete_Bucket"
    - "Grade|Job_Family"
    - "Grade"

  peer_z_threshold_minor: 2.0
  peer_z_threshold_major: 3.0

  # -----------------------------------------------------------------------------
  # REGRESSION : poids du 3e signal (anomaly_regression.py) et reglages du modele OLS.
  # -----------------------------------------------------------------------------
  # rule_weight/ml_weight/reg_weight sont lus par aggregate_risk_with_regression
  # (anomaly_regression.py), PAS par aggregate_risk (anomaly_core.py) qui reste a 2 poids et
  # inchange. Leur somme doit valoir 1.0 ; rule_weight reste dominant car les regles restent le
  # signal le plus directement actionnable (hors bande, hors compa-ratio...).
  rule_weight: 0.6
  ml_weight: 0.25
  reg_weight: 0.15

  # En dessous de cet effectif, une modalite (ex: un metier tres rare) est regroupee dans
  # "Autre" avant l'ajustement du modele, pour eviter des colonnes de design quasi vides.
  reg_min_category_size: 10

  # Garde-fou de taille d'echantillon : si le nombre de lignes exploitables est trop faible par
  # rapport au nombre de parametres du modele (max des deux seuils ci-dessous), la regression est
  # ignoree (Reg_AnomalyScore reste vide sur tout le fichier) plutot que de produire un resultat
  # statistiquement fragile.
  reg_min_observations: 50
  reg_min_observations_per_param: 5

  prioritization_buckets:
    Critical: [70, 100]
    Major: [50, 69]
    Minor: [30, 49]
    Info: [0, 29]

# -----------------------------------------------------------------------------
# Conserve depuis config/rules.yaml, a titre de reference/documentation.
# -----------------------------------------------------------------------------

# Variables exploitees par l'IsolationForest (ml_anomaly) ET par la regression
# (anomaly_regression.py) - cette derniere ajoute en plus la variable Sexe comme regresseur,
# pour objectiver un ecart Homme/Femme "toutes choses egales par ailleurs".
ml_features:
  - Fixe_Annuel_MAD
  - CompaRatio
  - RangePenetration
  - MarketRatio
  - Age
  - Anciennete
  - Competence_N1
  - Positionnement_9BOX
  - Hot_job

fx_to_mad:
  MAD: 1.0
  EUR: 10.8
  USD: 10.0
